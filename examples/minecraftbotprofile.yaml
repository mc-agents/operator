# The defaults bots in this namespace are built from. A bot takes every field its own spec leaves
# empty from the nearest profile: this one when it is named "default" or by spec.profileRef, then
# the ClusterMinecraftBotProfile named "default", then the operator's flags.
apiVersion: mc-agents.junhyung.cloud/v1alpha1
kind: MinecraftBotProfile
metadata:
  name: quest
spec:
  fabric:
    # Bot releases, without the Minecraft version; -mc<minecraftVersion> is appended.
    tag: "0.71.0"
  azalea:
    tag: "0.23.0"
    resources:
      limits:
        memory: 512Mi
