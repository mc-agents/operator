apiVersion: mc-agents.junhyung.cloud/v1alpha1
kind: MinecraftBotPool
metadata:
  name: scouts
spec:
  replicas: 3
  template:
    metadata:
      labels:
        squad: qa
    spec:
      kind: fabric
      minecraftVersion: "26.1.2"
      server:
        host: mc-agents-mcp-server-bots.game.svc
        port: 8765
      # Every bot of the pool presents the same token, as every bot of the namespace does.
      linkTokenSecretRef:
        name: mc-agents-mcp-server-link
