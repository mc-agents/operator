apiVersion: mc-agents.junhyung.cloud/v1alpha1
kind: MinecraftBot
metadata:
  name: looker
spec:
  kind: fabric
  minecraftVersion: "26.1.2"
  server:
    host: mc-agents-mcp-server-bots.game.svc
    port: 8765
  linkTokenSecretRef:
    name: mc-agents-mcp-server-link
  render:
    # The window the client draws into, and the virtual display sized to match it. This is the
    # resolution frames are captured at, not the size a screenshot comes back as: the tool scales
    # its capture to whatever the caller asked for, so raising this buys detail rather than a
    # bigger image. Every pixel is software-rendered into system memory, so raise it on purpose.
    width: 854
    height: 480
    # Chunks loaded and simulated, and the largest lever on this pod's memory: there is no graphics
    # card, so every chunk mesh sits in system memory. A fresh client picks sixteen.
    distance: 8
    # Ticks and frames are separate, so one frame a second still leaves networking, physics and
    # inventory running at full speed. Raise it only when a screenshot needs motion.
    frameRateLimit: 1
  assets:
    # Unset claimName falls back to an emptyDir, which means every pod re-downloads 200-600MB
    # from the Mojang manifest. Fill a PVC once with a Job and set prefilled to mount it instead.
    claimName: mc-assets-26-1-2
    prefilled: true
    readOnly: true
  # The operator's defaults, spelled out. Measured rather than budgeted: a bot in a flat world
  # with no resource pack sits at 1.7GiB, because under Xvfb there is no graphics card and every
  # texture and chunk mesh is system memory. The limit was 3Gi until 0.22.0, where a bot that
  # joined a server with a resource pack was OOM killed and left an X lock behind, so the restart
  # failed on the display and nothing in the logs said memory.
  resources:
    requests:
      cpu: 500m
      memory: 2Gi
    limits:
      memory: 4Gi
