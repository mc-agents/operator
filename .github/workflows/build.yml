name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  REGISTRY: junhyung.cloud
  IMAGE: junhyung.cloud/library/operator
  # Charts must not share a repository with the image: the same tag overwrites the other.
  CHART_REPO: oci://junhyung.cloud/library/charts
  CHART_REPO_HOST: junhyung.cloud/library/charts

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # The version check diffs against the commit this one replaced, which a shallow
          # clone does not have.
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # On a pull request the base branch is the comparison; on a push it is the commit that was
      # replaced. A force push leaves nothing to compare against, so only the consistency half
      # runs there.
      - name: version is consistent and was raised
        env:
          FORCED: ${{ github.event.forced }}
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          EMPTY_SHA: '0000000000000000000000000000000000000000'
        run: |
          if [ "$FORCED" = true ] || [ -z "$BASE" ] || [ "$BASE" = "$EMPTY_SHA" ]; then
            bash hack/check-version.sh
          else
            bash hack/check-version.sh "$BASE"
          fi

      - run: go build ./...
      - run: go vet ./...
      - run: go test -race ./...

      - name: generated files match the types
        run: |
          make generate
          git diff --exit-code -- api charts/mc-agents-operator/crds \
            || { echo "::error::run make generate and commit the result"; exit 1; }

      - name: chart renders
        run: |
          helm lint charts/mc-agents-operator
          helm template charts/mc-agents-operator > /dev/null

  publish:
    needs: check
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Harbor takes a robot account, so the credentials are repository secrets. cosign
      # stays keyless: the certificate comes from Fulcio and no key lives here either.
      # Lets cosign fetch a short-lived certificate from Fulcio, so no key lives in the repo.
      id-token: write
    steps:
      - uses: actions/checkout@v5

      - id: tag
        run: |
          version=$(tr -d '[:space:]' < VERSION)
          stamp=$(date -u +%Y%m%d%H%M%S)
          sha=$(git rev-parse --short=8 HEAD)
          case "$version" in *-*) sep=. ;; *) sep=- ;; esac
          echo "value=${version}${sep}${stamp}.g${sha}" >> "$GITHUB_OUTPUT"
          # A chart's appVersion falls back to this one, so it has to exist in the registry.
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - uses: sigstore/cosign-installer@v3

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: mode=max
          sbom: true
          build-args: |
            VERSION=${{ steps.tag.outputs.value }}
          tags: |
            ${{ env.IMAGE }}:${{ steps.tag.outputs.value }}
            ${{ env.IMAGE }}:${{ steps.tag.outputs.version }}
            ${{ env.IMAGE }}:latest
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE }}:buildcache,mode=max,image-manifest=true,oci-mediatypes=true

      - name: sign image
        run: cosign sign --yes "${{ env.IMAGE }}@${{ steps.build.outputs.digest }}"

      - name: push chart
        env:
          TAG: ${{ steps.tag.outputs.value }}
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
        run: |
          helm package charts/mc-agents-operator --version "$TAG" --app-version "$TAG" --destination dist-chart
          printf '%s' "$REGISTRY_PASSWORD" \
            | helm registry login "$REGISTRY" --username "$REGISTRY_USERNAME" --password-stdin
          helm push "dist-chart/mc-agents-operator-$TAG.tgz" "$CHART_REPO" 2>&1 | tee push.log
          digest=$(grep -o 'sha256:[0-9a-f]\{64\}' push.log | head -1)
          test -n "$digest"
          cosign sign --yes "$CHART_REPO_HOST/mc-agents-operator@$digest"

      - run: |
          {
            echo "published \`${{ env.IMAGE }}:${{ steps.tag.outputs.value }}\`"
            echo ""
            echo "verify:"
            echo '```'
            echo "cosign verify ${{ env.IMAGE }}:${{ steps.tag.outputs.value }} \\"
            echo "  --certificate-identity-regexp '^https://github.com/${{ github.repository }}/' \\"
            echo "  --certificate-oidc-issuer https://token.actions.githubusercontent.com"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
