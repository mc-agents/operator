name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  REGISTRY: junhyung.cloud
  IMAGE: junhyung.cloud/library/operator
  # Charts must not share a repository with the image: the same tag overwrites the other.
  CHART_REPO: oci://junhyung.cloud/library/charts
  CHART_REPO_HOST: junhyung.cloud/library/charts

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # The version check diffs against the commit this one replaced, which a shallow
          # clone does not have.
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # The same target a laptop runs, so nothing passes here that failed there. On a pull request
      # the base branch is the version comparison; on a push it is the commit that was replaced. A
      # force push leaves nothing to compare against, so BASE stays empty and only the consistency
      # half of the version check runs.
      - run: make check
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || (!github.event.forced && github.event.before) || '' }}

      # Advisory of the day it runs, so it stays out of make check: a vulnerability published
      # overnight should fail the next push, not the one that was already green.
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  # The reconcile loop is not proven by unit tests, and until here nothing that was published had
  # run on a cluster. The same script a laptop runs, against the same kind of cluster.
  verify:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # The action's own default is a k3d from 2022. This is the k3d a laptop runs, and with it the
      # k3s the README names as the version verified against.
      - uses: AbsaOSS/k3d-action@v2
        with:
          cluster-name: ci
          k3d-version: v5.9.0
          args: --agents 1 --wait

      - run: make k3d-deploy k3d-verify K3D_CLUSTER=ci

      - name: collect the cluster's side of the story
        if: failure()
        run: |
          mkdir -p verify-failure
          kubectl --context k3d-ci get events -A --sort-by=.lastTimestamp > verify-failure/events.txt || true
          kubectl --context k3d-ci -n mc-agents-system logs deploy/mc-agents-operator --all-containers > verify-failure/operator.log || true
          kubectl --context k3d-ci get minecraftbots,minecraftbotpools,mcpservers -A -o yaml > verify-failure/objects.yaml || true
          kubectl --context k3d-ci get pods -A -o wide > verify-failure/pods.txt || true
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: verify-failure
          path: verify-failure

  publish:
    needs: [check, verify]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Harbor takes a robot account, so the credentials are repository secrets. cosign
      # stays keyless: the certificate comes from Fulcio and no key lives here either.
      id-token: write
    steps:
      - uses: actions/checkout@v5

      - id: tag
        run: |
          version=$(tr -d '[:space:]' < VERSION)
          stamp=$(date -u +%Y%m%d%H%M%S)
          sha=$(git rev-parse --short=8 HEAD)
          case "$version" in *-*) sep=. ;; *) sep=- ;; esac
          echo "value=${version}${sep}${stamp}.g${sha}" >> "$GITHUB_OUTPUT"
          # The chart is published under this version with it as appVersion, and an empty
          # image.tag falls back to appVersion, so the image has to exist under it too.
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - uses: sigstore/cosign-installer@v3

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: mode=max
          sbom: true
          build-args: |
            VERSION=${{ steps.tag.outputs.value }}
          tags: |
            ${{ env.IMAGE }}:${{ steps.tag.outputs.value }}
            ${{ env.IMAGE }}:${{ steps.tag.outputs.version }}
            ${{ env.IMAGE }}:latest
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE }}:buildcache,mode=max,image-manifest=true,oci-mediatypes=true

      - name: sign image
        run: cosign sign --yes "${{ env.IMAGE }}@${{ steps.build.outputs.digest }}"

      # Under the plain release version, which is what `helm install --version` is given. The
      # stamped image tag stays the immutable one; a chart stamped the same way was never
      # installable by the version anyone knew.
      - name: push chart
        env:
          VERSION: ${{ steps.tag.outputs.version }}
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
        run: |
          helm package charts/mc-agents-operator --version "$VERSION" --app-version "$VERSION" --destination dist-chart
          printf '%s' "$REGISTRY_PASSWORD" \
            | helm registry login "$REGISTRY" --username "$REGISTRY_USERNAME" --password-stdin
          helm push "dist-chart/mc-agents-operator-$VERSION.tgz" "$CHART_REPO" 2>&1 | tee push.log
          digest=$(grep -o 'sha256:[0-9a-f]\{64\}' push.log | head -1)
          test -n "$digest"
          cosign sign --yes "$CHART_REPO_HOST/mc-agents-operator@$digest"

      - run: |
          {
            echo "published \`${{ env.IMAGE }}:${{ steps.tag.outputs.value }}\` and chart \`${{ env.CHART_REPO }}/mc-agents-operator --version ${{ steps.tag.outputs.version }}\`"
            echo ""
            echo "verify:"
            echo '```'
            echo "cosign verify ${{ env.IMAGE }}:${{ steps.tag.outputs.value }} \\"
            echo "  --certificate-identity-regexp '^https://github.com/${{ github.repository }}/' \\"
            echo "  --certificate-oidc-issuer https://token.actions.githubusercontent.com"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
