# The operator holds no bot state: bots dial the MCP server themselves, so nothing here sits on
# the data path. A second replica is still only useful with leader election on, because two
# reconcilers racing on the same MinecraftBot would create and delete the same pod.
replicaCount: 1

image:
  registry: junhyung.cloud/mc-agents
  repository: operator
  # Empty falls back to Chart.appVersion. A promotion swaps only this value.
  tag: ""
  pullPolicy: IfNotPresent

# junhyung.cloud/mc-agents allows anonymous pull, so nothing is needed by default.
imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  name: ""
  annotations: {}

rbac:
  # The operator reads MinecraftBots and writes pods. Turn this off only when the rules are
  # managed elsewhere; the operator cannot work without them.
  create: true

crds:
  # Rendered from files/crds as release resources, so an upgrade carries the schema with it;
  # Helm's own crds/ directory is applied once and never again. Off when the CRDs are managed
  # elsewhere, and then they have to be applied by hand before every schema release.
  install: true
  # helm.sh/resource-policy: keep. Uninstalling the operator leaves the CRDs, and with them every
  # MCPServer and bot, rather than deleting a tenant's objects because the operator went away.
  keep: true

# Empty watches every namespace. Setting it narrows the informers, not the RBAC: the ClusterRole
# stays cluster-wide so the same release can be widened later without a permission change. The
# operator lives in its own namespace and tenants put MCPServers and bots in theirs, so a narrowed
# list names the tenants', not this release's.
watchNamespaces: []
# Deprecated: a single namespace, added to watchNamespaces.
watchNamespace: ""

# Concurrent reconciles per controller. Bots are independent of each other, so this is a
# throughput knob, not a correctness one.
workers: 2

# Informer resync. Pod events already drive reconciles; this only catches a missed watch event.
resyncPeriod: 10m

leaderElection:
  # Required when replicaCount > 1; the chart refuses to render otherwise.
  enabled: false
  id: mc-agents-operator.mc-agents.junhyung.cloud
  # Empty uses the release namespace.
  namespace: ""
  leaseDuration: 15s

# What an MCPServer runs when its spec names no image. The tag is the MCP server release this
# operator release was verified against.
mcpServer:
  image: junhyung.cloud/mc-agents/mcp-server
  tag: "0.68.0"

# Renders ClusterMinecraftBotProfile "default", which every bot without a nearer profile takes its
# image tags and pod settings from. Its spec is a MinecraftBotProfile spec, e.g.
#   spec:
#     fabric: {tag: 0.64.0}
#     azalea: {tag: 0.16.0}
# Helm validates every rendered object before it creates any, so on a first install the CRD this
# needs does not exist yet: install once, then turn it on.
defaultProfile:
  create: false
  spec: {}

# The last defaults, under every profile.
bots:
  # Where the bot images live. The operator builds
  #   <registry>/bot-fabric:<fabricTag>-mc<spec.minecraftVersion>
  #   <registry>/bot-azalea:<azaleaTag>-mc<spec.minecraftVersion>
  # so an image is always pinned to one Minecraft version: each kind is built against one.
  registry: junhyung.cloud/mc-agents
  # The bot releases this operator release was verified against. latest resolves to a moving
  # tag, and IfNotPresent keeps whatever build a node pulled first.
  fabricTag: "0.74.0"
  azaleaTag: "0.26.0"

  # fabric bots cannot ship the Minecraft client jar inside the image: redistribution is not
  # ours to grant. An initContainer pulls it from the Mojang version manifest into a cache
  # volume instead. Point spec.assets.claimName at a PVC that a Job already filled to turn that
  # 200-600MB download into a mount. Published from bot-fabric under its version, so the tag is
  # fabricTag's; the Minecraft version is appended as for the bot images.
  assetFetcherImage: junhyung.cloud/mc-agents/mc-assets:0.73.1

  # Paper refuses a second login from the same address within four seconds. Bot pods each get
  # their own IP so this rarely bites, but a pool scaling from 0 to 8 creates eight pods in one
  # reconcile sweep, and spacing them costs nothing. 0 disables the gate.
  spawnInterval: 4s

metrics:
  # Served without auth on the pod IP; nothing bot-identifying is exported.
  enabled: true
  port: 8080
  serviceMonitor:
    enabled: false
    interval: 30s
    scrapeTimeout: 10s
    # Labels the Prometheus instance selects on, e.g. release: kube-prometheus-stack
    labels: {}

# /readyz turns green only once the informer caches have synced, so a rollout does not report
# healthy while it is still blind to existing bots.
probes:
  port: 8081
  readiness:
    httpGet:
      path: /readyz
      port: probes
    periodSeconds: 10
  liveness:
    httpGet:
      path: /healthz
      port: probes
    periodSeconds: 30
    timeoutSeconds: 5

# The operator is a watch loop with two small caches. Memory scales with the number of bots and
# pods it tracks, not with what the bots are doing.
resources:
  requests:
    cpu: 50m
    memory: 96Mi
  limits:
    memory: 256Mi

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

nodeSelector: {}
tolerations: []
affinity: {}
podAnnotations: {}
podLabels: {}

# Extra environment variables. The operator is configured by flags, so nothing here collides.
extraEnv: []

# CLI flags the chart does not model, passed straight through. Verbosity is --zap-log-level:
# debug shows the operator's V(1) lines, an integer shows down to that depth, and 2 includes
# the spawn throttle waits. -v raises only what client-go says.
extraArgs: []
# extraArgs: ["--zap-log-level=2"]
